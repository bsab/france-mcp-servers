name: Link check

# External links can break when projects move or disappear. Run on a schedule,
# not on every PR: these failures are outside the contributor's control.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check catalog links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            README.md 'servers/*.json'
          fail: false

      - name: Open or update an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Unreachable catalog links"
          content-filepath: ./lychee/out.md
          labels: bug
