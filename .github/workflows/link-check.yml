name: Link check

# External links can break when projects move or disappear. Run on a schedule,
# not on every PR: these failures are outside the contributor's control.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check catalog links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MCP endpoints reject ordinary GET requests even when they are healthy.
      - name: Exclude MCP endpoints from the generic link check
        run: python3 scripts/check_mcp_endpoints.py exclusions "$RUNNER_TEMP/mcp-endpoints.txt"

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-file '${{ runner.temp }}/mcp-endpoints.txt'
            README.md 'servers/*.json'
          fail: false

      - name: Check MCP endpoints
        id: mcp
        continue-on-error: true
        run: python3 scripts/check_mcp_endpoints.py check --report ./lychee/mcp-out.md

      - name: Combine failure reports
        if: steps.lychee.outputs.exit_code != 0 || steps.mcp.outcome == 'failure'
        run: |
          if [[ "${{ steps.mcp.outcome }}" == "failure" ]]; then
            if [[ "${{ steps.lychee.outputs.exit_code }}" != "0" ]]; then
              printf '\n---\n\n' >> ./lychee/out.md
              cat ./lychee/mcp-out.md >> ./lychee/out.md
            else
              cp ./lychee/mcp-out.md ./lychee/out.md
            fi
          fi

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0 || steps.mcp.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Unreachable catalog links"
          content-filepath: ./lychee/out.md
          labels: bug
